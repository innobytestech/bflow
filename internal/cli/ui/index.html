<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bflow</title>
<style>
:root {
  color-scheme: dark;
  --bg: #0d1017;
  --surface: #141925;
  --rule: #262d3d;
  --text: #e7eaf1;
  --muted: #98a1b6;
  --brand: #4d8dff;
  --agent: #5aaeff;
  --human: #f2b441;
  --human-tint: rgba(242, 180, 65, .10);
  --human-rule: rgba(242, 180, 65, .45);
  --done: #4cc38a;
  --danger: #ff6b6b;
  --select: rgba(77, 141, 255, .35);
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  --mono: ui-monospace, "Cascadia Mono", SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: light) {
  :root {
    color-scheme: light;
    --bg: #f6f7f9;
    --surface: #ffffff;
    --rule: #dfe3ea;
    --text: #161b26;
    --muted: #586176;
    --brand: #2449d8;
    --agent: #0a66b8;
    --human: #8a5a00;
    --human-tint: rgba(214, 150, 20, .12);
    --human-rule: rgba(160, 105, 0, .45);
    --done: #147a4c;
    --danger: #c62828;
    --select: rgba(36, 73, 216, .22);
  }
}
* { box-sizing: border-box; }
html { scrollbar-color: var(--rule) transparent; }
::selection { background: var(--select); }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.55 var(--sans); font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
}
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 4px; }

header {
  display: flex; align-items: center; justify-content: space-between; gap: 12px 24px; flex-wrap: wrap;
  max-width: 920px; margin: 0 auto; padding: 20px 20px 0;
}
.wordmark { font-weight: 750; font-size: 18px; color: var(--brand); letter-spacing: -.01em; }
.meta { color: var(--muted); font-size: 13px; }
.meta b { color: var(--text); font-weight: 500; }
.bar { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.offline { color: var(--danger); }

button {
  font: 500 13px/1 var(--sans); color: var(--text); background: var(--surface);
  border: 1px solid var(--rule); border-radius: 6px; padding: 7px 12px; cursor: pointer;
  transition: border-color .15s ease-out, background .15s ease-out;
}
button:hover { border-color: var(--brand); }
button:active { background: var(--bg); }
button:disabled { opacity: .5; cursor: default; }

main { max-width: 920px; margin: 0 auto; padding: 8px 20px 48px; }
section { padding: 28px 0; border-top: 1px solid var(--rule); }
section:first-child { border-top: 0; padding-top: 20px; }
section.flush { border-top: 0; padding-top: 4px; }
h1 { font-size: 22px; line-height: 1.3; font-weight: 650; margin: 4px 0 0; letter-spacing: -.01em; text-wrap: balance; }
h2 { font-size: 15px; font-weight: 650; margin: 0 0 12px; }
h3 { font-size: 13px; font-weight: 600; color: var(--muted); margin: 18px 0 6px; }
.id { color: var(--muted); font-size: 13px; }
.id b { color: var(--text); font-weight: 600; font-family: var(--mono); font-size: 13px; }

/* Progreso del carril: un riel continuo; lo hecho y la fase actual lo llenan. */
.rail { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); margin-top: 22px; }
.stage { position: relative; padding-top: 12px; font-size: 13px; color: var(--muted); overflow-wrap: anywhere; padding-right: 6px; }
.stage::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--rule); }
.stage:first-child::before { border-radius: 3px 0 0 3px; }
.stage:last-child::before { border-radius: 0 3px 3px 0; }
.stage.done { color: var(--text); }
.stage.done::before { background: var(--done); }
.stage.current { color: var(--agent); font-weight: 650; }
.stage.current::before { background: var(--agent); }
.waiting .stage.current { color: var(--human); }
.waiting .stage.current::before { background: var(--human); }

/* AHORA y DESPUÉS: lo único que pide atención; se tiñe cuando le toca a la persona. */
.status {
  display: grid; gap: 14px; padding: 20px 22px; margin: 0 -22px;
  border-radius: 10px; background: transparent; border: 1px solid transparent;
  transition: background .2s ease-out, border-color .2s ease-out;
}
.waiting .status { background: var(--human-tint); border-color: var(--human-rule); }
.step { display: grid; grid-template-columns: 76px 72px 1fr; gap: 12px; align-items: baseline; }
.step .when { color: var(--muted); font-size: 13px; }
.role { font-size: 12px; font-weight: 750; letter-spacing: .06em; }
.role.agent { color: var(--agent); }
.role.human { color: var(--human); }
.step .what { font-size: 17px; }
.step.now .what { font-size: 20px; font-weight: 650; line-height: 1.35; }
.step.now.human .what { color: var(--human); }
.ago { color: var(--muted); font-size: 13px; font-weight: 400; white-space: nowrap; }

.details { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr)); gap: 12px 48px; }
dl { margin: 0; }
.kv { display: flex; justify-content: space-between; gap: 16px; padding: 6px 0; border-bottom: 1px solid var(--rule); }
.kv:last-child { border-bottom: 0; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; text-align: right; }
.kv.total dt, .kv.total dd { color: var(--text); font-weight: 650; }
.friction { color: var(--human); margin-top: 18px; }

ol.events { list-style: none; margin: 0; padding: 0; }
.events li { display: grid; grid-template-columns: 92px 1fr; gap: 12px; padding: 7px 0; border-bottom: 1px solid var(--rule); }
.events li:last-child { border-bottom: 0; }
.events time { color: var(--muted); font-size: 13px; }

.empty h1 { margin-bottom: 6px; }
.empty p, .lost p { color: var(--muted); margin: 0; }
.empty code, .lost code { font-family: var(--mono); font-size: 13px; color: var(--text); }
.skeleton { height: 14px; border-radius: 4px; background: var(--rule); margin: 10px 0; }

@media (max-width: 640px) {
  .rail { grid-auto-flow: row; grid-auto-columns: auto; grid-template-columns: repeat(3, minmax(0, 1fr)); row-gap: 14px; }
  .step { grid-template-columns: 1fr; gap: 2px; }
  .status { margin: 0 -14px; padding: 16px 14px; }
  .events li { grid-template-columns: 1fr; gap: 0; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header>
  <div class="bar">
    <span class="wordmark">bflow</span>
    <span class="meta"><b id="repo"></b> · <span id="version"></span></span>
  </div>
  <div class="bar">
    <span class="meta" id="status" aria-live="polite"></span>
    <button id="notify" hidden>Avisarme cuando me toque</button>
  </div>
</header>
<main id="app">
  <section><div class="skeleton" style="width:30%"></div><div class="skeleton" style="width:60%;height:22px"></div><div class="skeleton" style="width:100%"></div></section>
</main>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}
function ago(iso) {
  const s = Math.max(1, Math.round((Date.now() - new Date(iso).getTime()) / 1000));
  if (s < 60) return s + "s";
  const m = Math.floor(s / 60);
  if (m < 60) return m + "m";
  const h = Math.floor(m / 60);
  return h < 48 ? h + "h" + String(m % 60).padStart(2, "0") + "m" : Math.floor(h / 24) + "d" + (h % 24) + "h";
}
function clock(iso) {
  return new Date(iso).toLocaleTimeString("es-MX", { hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false });
}

let state = null;
let lastWait = "";
try { lastWait = localStorage.getItem("bflow-last-wait") || ""; } catch (e) {}

function stepRow(kind, s) {
  const row = el("div", "step " + kind + (s.human ? " human" : ""));
  row.append(el("span", "when", kind === "now" ? "Ahora" : "Después"));
  row.append(el("span", "role " + (s.human ? "human" : "agent"), s.human ? "TÚ" : "AGENTE"));
  const what = el("span", "what", s.text + " ");
  if (kind === "now" && s.since) {
    const a = el("span", "ago");
    a.dataset.since = s.since;
    a.dataset.prefix = s.human ? "esperando hace " : "hace ";
    what.append(a);
  }
  row.append(what);
  return row;
}

function kv(k, v, cls) {
  const d = el("div", "kv" + (cls ? " " + cls : ""));
  d.append(el("dt", "", k), el("dd", "", v));
  return d;
}

function render() {
  const app = $("app");
  app.replaceChildren();
  $("version").textContent = state.version;
  $("repo").textContent = state.repo;
  const t = state.task;
  document.body.classList.toggle("waiting", !!(t && t.waiting));
  document.title = t ? (t.waiting ? "Te toca · " : "") + t.id + " · bflow" : "bflow";

  if (!t) {
    const s = el("section", "empty");
    s.append(el("h1", "", "Ninguna tarea en curso"));
    const p = el("p", "", "Empieza una desde la sesión con ");
    p.append(el("code", "", "bflow start <ID> --lane full|light|hotfix"), document.createTextNode(". Este panel la muestra en cuanto arranca."));
    s.append(p);
    app.append(s);
  } else {
    const head = el("section");
    const id = el("div", "id");
    id.append(el("b", "", t.id));
    let extra = t.lane ? " · carril " + t.lane : "";
    if (t.round) extra += " · ronda " + t.round;
    id.append(document.createTextNode(extra));
    head.append(id, el("h1", "", t.title || t.id));
    const rail = el("div", "rail");
    rail.setAttribute("role", "list");
    rail.setAttribute("aria-label", "Fases del carril");
    t.phases.forEach((p) => {
      const st = el("span", "stage " + p.state, p.name);
      st.setAttribute("role", "listitem");
      if (p.state === "current") st.setAttribute("aria-current", "step");
      rail.append(st);
    });
    head.append(rail);
    app.append(head);

    if (t.now || t.next) {
      const sec = el("section", "flush");
      const box = el("div", "status");
      if (t.now) box.append(stepRow("now", t.now));
      if (t.next) box.append(stepRow("next", t.next));
      sec.append(box);
      app.append(sec);
    }

    const det = el("section");
    const grid = el("div", "details");
    const time = el("div");
    time.append(el("h2", "", "Tiempo"));
    const tl = el("dl");
    tl.append(kv("Total", t.time.total, "total"), kv("Agentes", t.time.agents), kv("Tú", t.time.human));
    if (t.time.blocked) tl.append(kv("Bloqueada", t.time.blocked));
    time.append(tl);
    if (t.by_phase && t.by_phase.length) {
      time.append(el("h3", "", "Por fase"));
      const pl = el("dl");
      t.by_phase.forEach((p) => pl.append(kv(p.phase, p.time)));
      time.append(pl);
    }
    grid.append(time);
    if (t.tokens) {
      const tok = el("div");
      tok.append(el("h2", "", "Tokens"));
      const dl = el("dl");
      dl.append(kv("Total", t.tokens, "total"));
      (t.agents || []).forEach((a) => dl.append(kv(a.name, a.tokens)));
      tok.append(dl);
      if (t.friction) tok.append(el("p", "friction", "Fricción: " + t.friction));
      grid.append(tok);
    }
    det.append(grid);
    app.append(det);

    if (t.events && t.events.length) {
      const ev = el("section");
      ev.append(el("h2", "", "Últimos eventos"));
      const ol = el("ol", "events");
      t.events.forEach((e) => { const li = el("li"); li.append(el("time", "", e.time), el("span", "", e.text)); ol.append(li); });
      ev.append(ol);
      app.append(ev);
    }
  }
  if (state.others && state.others.length) {
    const o = el("section");
    o.append(el("h2", "", "Otras tareas en curso"));
    const dl = el("dl");
    state.others.forEach((x) => dl.append(kv(x.id + " · " + x.phase, x.next)));
    o.append(dl);
    app.append(o);
  }
  tick();
}

function tick() {
  document.querySelectorAll(".ago").forEach((a) => { a.textContent = a.dataset.prefix + ago(a.dataset.since); });
}

function lost(msg) {
  $("status").textContent = "Sin conexión";
  $("status").className = "meta offline";
  if (state) return; // se queda el último estado; el encabezado avisa
  const s = el("section", "lost");
  s.append(el("h1", "", "Sin conexión con bflow"));
  const p = el("p", "", "La página la sirve la ventana del panel. Si la cerraste, ábrela otra vez con ");
  p.append(el("code", "", "bflow watch --web"), document.createTextNode(" o "), el("code", "", "bflow ui"), document.createTextNode(". (" + msg + ")"));
  s.append(p);
  $("app").replaceChildren(s);
}

function maybeNotify() {
  const t = state.task;
  const key = t && t.waiting && t.now ? t.id + "|" + t.now.text + "|" + (t.now.since || "") : "";
  if (key && key !== lastWait && "Notification" in window && Notification.permission === "granted") {
    new Notification("bflow · " + t.id, { body: "Espera tu decisión: " + t.now.text, tag: "bflow-" + t.id });
  }
  lastWait = key;
  try { localStorage.setItem("bflow-last-wait", key); } catch (e) {}
}

async function poll() {
  try {
    const r = await fetch("/api/state", { cache: "no-store" });
    const next = await r.json();
    if (!r.ok) throw new Error(next.error || r.statusText);
    state = next;
    $("status").textContent = "Actualizado " + clock(state.now);
    $("status").className = "meta";
    render();
    maybeNotify();
  } catch (e) {
    lost(e.message);
  }
}

if ("Notification" in window && Notification.permission === "default") {
  const b = $("notify");
  b.hidden = false;
  b.onclick = () => { b.disabled = true; Notification.requestPermission().then(() => { b.hidden = true; }); };
}
poll();
setInterval(poll, 2000);
setInterval(tick, 1000);
</script>
</body>
</html>
