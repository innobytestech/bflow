# golangci-lint v2. El preset std-error-handling conserva lo que v1 excluía
# por defecto (Close, Fprint* y similares sin revisar).
version: "2"
linters:
  exclusions:
    presets:
      - std-error-handling
    rules:
      # Las pruebas arman fixtures con os.WriteFile; si fallan, la prueba falla sola.
      - path: _test\.go
        linters: [errcheck]
        source: os\.WriteFile
